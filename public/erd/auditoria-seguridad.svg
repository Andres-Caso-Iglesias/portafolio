<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Auditoria de Seguridad Web - Arquitectura de Modulos</text>

  <!-- ROW 1: Entry Point -->

  <!-- Scanner Controller -->
  <rect x="300" y="60" width="200" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">ScannerController</text>
  <text x="400" y="100" text-anchor="middle" fill="#94a3b8" font-size="10">POST /api/scan</text>

  <!-- Arrow down -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#475569" stroke-width="2"/>
  <polygon points="393,138 400,148 407,138" fill="#475569"/>

  <!-- Scanner Service (orchestrator) -->
  <rect x="280" y="150" width="240" height="50" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="bold">ScannerService</text>
  <text x="400" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">Orquestador - Promise.all paralelo</text>

  <!-- History Service (auto-save) -->
  <rect x="560" y="150" width="200" height="50" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="660" y="175" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="bold">HistoryService</text>
  <text x="660" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">Auto-guarda de escaneos</text>

  <!-- Arrow from ScannerService to HistoryService -->
  <line x1="520" y1="175" x2="550" y2="175" stroke="#475569" stroke-width="2"/>
  <polygon points="548,169 558,175 548,181" fill="#475569"/>

  <!-- Arrow down from ScannerService to parallel checks -->
  <line x1="400" y1="200" x2="400" y2="230" stroke="#475569" stroke-width="2"/>
  <polygon points="393,228 400,238 407,228" fill="#475569"/>

  <!-- ROW 2: Parallel Checks row 1 -->

  <!-- HTTP Client -->
  <rect x="40" y="250" width="140" height="55" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="110" y="272" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">HttpClientService</text>
  <text x="110" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">Axios fetch HTTP</text>

  <!-- TLS Checker -->
  <rect x="200" y="250" width="140" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="272" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">TlsCheckerService</text>
  <text x="270" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">tls.connect() raw</text>

  <!-- DNS Checker -->
  <rect x="360" y="250" width="140" height="55" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="430" y="272" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">DnsCheckerService</text>
  <text x="430" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">dns/promises nativo</text>

  <!-- Security Files -->
  <rect x="520" y="250" width="130" height="55" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
  <text x="585" y="272" text-anchor="middle" fill="#14b8a6" font-size="11" font-weight="bold">SecurityFileChecker</text>
  <text x="585" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">security.txt + robots</text>

  <!-- Connections from ScannerService to parallel checks -->
  <line x1="340" y1="225" x2="110" y2="250" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="225" x2="270" y2="250" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="225" x2="430" y2="250" stroke="#475569" stroke-width="1.5"/>
  <line x1="430" y1="225" x2="585" y2="250" stroke="#475569" stroke-width="1.5"/>

  <!-- ROW 3: Parallel Checks row 2 -->

  <!-- Sensitive Files -->
  <rect x="40" y="330" width="140" height="55" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="110" y="352" text-anchor="middle" fill="#f43f5e" font-size="11" font-weight="bold">SensitiveFileChecker</text>
  <text x="110" y="370" text-anchor="middle" fill="#94a3b8" font-size="9">40 rutas sensibles</text>

  <!-- SRI Checker -->
  <rect x="200" y="330" width="140" height="55" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="270" y="352" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="bold">SriCheckerService</text>
  <text x="270" y="370" text-anchor="middle" fill="#94a3b8" font-size="9">Subresource Integrity</text>

  <!-- Tech Fingerprinter -->
  <rect x="360" y="330" width="140" height="55" rx="6" fill="#1e293b" stroke="#d946ef" stroke-width="2"/>
  <text x="430" y="352" text-anchor="middle" fill="#d946ef" font-size="11" font-weight="bold">TechFingerprinter</text>
  <text x="430" y="370" text-anchor="middle" fill="#94a3b8" font-size="9">24 firmas + 25 CVEs</text>

  <!-- Connections from ScannerService to row 2 -->
  <line x1="340" y1="225" x2="110" y2="330" stroke="#475569" stroke-width="1.5"/>
  <line x1="370" y1="225" x2="270" y2="330" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="225" x2="430" y2="330" stroke="#475569" stroke-width="1.5"/>

  <!-- STAGE 2: Sequential analysis (after Promise.all) -->

  <!-- Analyzer (15 checkers) -->
  <rect x="520" y="405" width="240" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="640" y="427" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="bold">AnalyzerService</text>
  <text x="640" y="445" text-anchor="middle" fill="#94a3b8" font-size="9">15 checkers + ScoreCalculator</text>

  <!-- Arrow from ScannerService to AnalyzerService -->
  <line x1="505" y1="200" x2="505" y2="215" stroke="#475569" stroke-width="2"/>
  <line x1="505" y1="215" x2="660" y2="215" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="215" x2="660" y2="395" stroke="#475569" stroke-width="2"/>
  <polygon points="653,393 660,403 667,393" fill="#475569"/>

  <!-- Direct edge: ScannerService to ComplianceService -->
  <line x1="280" y1="185" x2="15" y2="185" stroke="#475569" stroke-width="2"/>
  <line x1="15" y1="185" x2="15" y2="520" stroke="#475569" stroke-width="2"/>
  <line x1="15" y1="520" x2="150" y2="520" stroke="#475569" stroke-width="2"/>
  <polygon points="148,513 158,520 148,527" fill="#475569"/>

  <!-- Direct edge: ScannerService to Report -->
  <line x1="280" y1="198" x2="30" y2="198" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="198" x2="30" y2="470" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="470" x2="570" y2="470" stroke="#475569" stroke-width="2"/>
  <line x1="570" y1="470" x2="570" y2="485" stroke="#475569" stroke-width="2"/>
  <polygon points="563,483 570,493 577,483" fill="#475569"/>

  <!-- ROW 5: Processing -->

  <!-- Compliance -->
  <rect x="160" y="495" width="220" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="517" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">ComplianceService</text>
  <text x="270" y="533" text-anchor="middle" fill="#94a3b8" font-size="9">OWASP Top 10, NIS2, ENS e ISO27001</text>

  <!-- Report -->
  <rect x="460" y="495" width="220" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="570" y="517" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">ReportService + ExportService</text>
  <text x="570" y="533" text-anchor="middle" fill="#94a3b8" font-size="9">JSON + PDF (pdfkit) download</text>

  <!-- Legend -->
  <rect x="40" y="565" width="720" height="18" rx="3" fill="#1e293b"/>
  <text x="50" y="578" fill="#94a3b8" font-size="9">Frontend React 19 + Vite 8 consume API via proxy /api -&gt; NestJS :3000</text>
</svg>
