<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">Auditoría de Seguridad Web - Diagrama Entidad-Relación</text>
  
  <!-- ROW 1: Main Entities -->
  
  <!-- Entity: Objetivo -->
  <rect x="50" y="70" width="150" height="100" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="95" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">Objetivo</text>
  <line x1="50" y1="110" x2="200" y2="110" stroke="#475569"/>
  <text x="60" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="60" y="148" fill="#94a3b8" font-size="12">- url: String</text>
  
  <!-- Entity: Escaneo -->
  <rect x="280" y="70" width="180" height="130" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="370" y="95" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">Escaneo</text>
  <line x1="280" y1="110" x2="460" y2="110" stroke="#475569"/>
  <text x="290" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="290" y="148" fill="#94a3b8" font-size="12">- id_objetivo: FK</text>
  <text x="290" y="166" fill="#94a3b8" font-size="12">- fecha_inicio: Date</text>
  <text x="290" y="184" fill="#94a3b8" font-size="12">- estado: Enum</text>
  
  <!-- Entity: Hallazgo -->
  <rect x="540" y="70" width="200" height="140" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Hallazgo</text>
  <line x1="540" y1="110" x2="740" y2="110" stroke="#475569"/>
  <text x="550" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="550" y="148" fill="#94a3b8" font-size="12">- id_escaneo: FK</text>
  <text x="550" y="166" fill="#94a3b8" font-size="12">- titulo: String</text>
  <text x="550" y="184" fill="#94a3b8" font-size="12">- severidad: Enum</text>
  
  <!-- ROW 2: Child Entities (aligned under Escaneo) -->
  
  <!-- Entity: AuditoriaHeader (centered under Escaneo at x=370) -->
  <rect x="280" y="260" width="180" height="100" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="370" y="285" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">AuditoriaHeader</text>
  <line x1="280" y1="300" x2="460" y2="300" stroke="#475569"/>
  <text x="290" y="320" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="290" y="338" fill="#94a3b8" font-size="12">- id_escaneo: FK</text>
  <text x="290" y="356" fill="#94a3b8" font-size="12">- header_name: String</text>
  
  <!-- Entity: Reporte (next to AuditoriaHeader) -->
  <rect x="490" y="260" width="180" height="80" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="580" y="285" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">Reporte</text>
  <line x1="490" y1="300" x2="670" y2="300" stroke="#475569"/>
  <text x="500" y="320" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="500" y="338" fill="#94a3b8" font-size="12">- id_escaneo: FK</text>
  
  <!-- Relationships -->
  <!-- Objetivo -> Escaneo -->
  <line x1="200" y1="120" x2="280" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Escaneo -> Hallazgo -->
  <line x1="460" y1="140" x2="540" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="135" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Escaneo -> AuditoriaHeader (vertical) -->
  <line x1="370" y1="200" x2="370" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="235" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Escaneo -> Reporte -->
  <line x1="460" y1="200" x2="460" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="230" x2="490" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="230" x2="490" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="475" y="225" text-anchor="middle" fill="#94a3b8" font-size="10">1:1</text>
  
  <!-- Legend -->
  <rect x="50" y="400" width="700" height="40" rx="4" fill="#1e293b"/>
  <text x="60" y="420" fill="#94a3b8" font-size="11">Leyenda:</text>
  <rect x="110" y="412" width="10" height="10" fill="#3b82f6"/> <text x="128" y="420" fill="#94a3b8" font-size="11">Entidad</text>
  <circle cx="190" cy="417" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="205" y="420" fill="#94a3b8" font-size="11">PK</text>
  <circle cx="240" cy="417" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="255" y="420" fill="#94a3b8" font-size="11">FK</text>
  <text x="380" y="420" fill="#94a3b8" font-size="11">Cardinalidad: N (muchos), 1 (uno)</text>
  
  <!-- Severity indicator -->
  <text x="600" y="420" fill="#dc2626" font-size="10">● Crítica</text>
  <text x="660" y="420" fill="#f59e0b" font-size="10">● Alta</text>
</svg>