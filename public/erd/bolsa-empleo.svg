<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">Bolsa de Empleo - Diagrama Entidad-Relación</text>
  
  <!-- ROW 1: Root Entity -->
  
  <!-- Entity: User -->
  <rect x="300" y="65" width="180" height="100" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="390" y="90" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">User</text>
  <line x1="300" y1="105" x2="480" y2="105" stroke="#475569"/>
  <text x="310" y="125" fill="#94a3b8" font-size="12">- id: number (PK)</text>
  <text x="310" y="143" fill="#94a3b8" font-size="12">- email: String (unique)</text>
  <text x="310" y="161" fill="#94a3b8" font-size="12">- password: String (hash)</text>
  
  <!-- ROW 2: Inheritance via 1:1 -->
  
  <!-- Entity: CompanyProfile -->
  <rect x="50" y="220" width="180" height="120" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="140" y="245" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">CompanyProfile</text>
  <line x1="50" y1="260" x2="230" y2="260" stroke="#475569"/>
  <text x="60" y="280" fill="#94a3b8" font-size="11">- id: number (PK)</text>
  <text x="60" y="296" fill="#94a3b8" font-size="11">- companyName: String</text>
  <text x="60" y="312" fill="#94a3b8" font-size="11">- email, description</text>
  <text x="60" y="328" fill="#94a3b8" font-size="11">- sector, website</text>
  
  <!-- Entity: AspirantProfile -->
  <rect x="290" y="220" width="200" height="120" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="245" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">AspirantProfile</text>
  <line x1="290" y1="260" x2="490" y2="260" stroke="#475569"/>
  <text x="300" y="280" fill="#94a3b8" font-size="11">- id: number (PK)</text>
  <text x="300" y="296" fill="#94a3b8" font-size="11">- firstName, lastName</text>
  <text x="300" y="312" fill="#94a3b8" font-size="11">- email, phone, bio</text>
  <text x="300" y="328" fill="#94a3b8" font-size="11">- cvUrl, skills, experience</text>
  
  <!-- ROW 3: Child Entities -->
  
  <!-- Entity: JobOffer -->
  <rect x="50" y="390" width="180" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="415" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">JobOffer</text>
  <line x1="50" y1="430" x2="230" y2="430" stroke="#475569"/>
  <text x="60" y="450" fill="#94a3b8" font-size="11">- title, description</text>
  <text x="60" y="465" fill="#94a3b8" font-size="11">- salary, location</text>
  
  <!-- Entity: Application -->
  <rect x="290" y="390" width="200" height="80" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="390" y="415" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="bold">Application</text>
  <line x1="290" y1="430" x2="490" y2="430" stroke="#475569"/>
  <text x="300" y="450" fill="#94a3b8" font-size="11">- status: Enum (pending/accepted/rejected)</text>
  <text x="300" y="465" fill="#94a3b8" font-size="11">- appliedAt: Date</text>
  
  <!-- Relationships -->
  <!-- User -> CompanyProfile -->
  <line x1="350" y1="165" x2="170" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">1:1</text>
  
  <!-- User -> AspirantProfile -->
  <line x1="410" y1="165" x2="400" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">1:1</text>
  
  <!-- CompanyProfile -> JobOffer -->
  <line x1="140" y1="340" x2="140" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- JobOffer -> Application -->
  <line x1="230" y1="430" x2="290" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="425" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- AspirantProfile -> Application (diagonal) -->
  <line x1="430" y1="340" x2="430" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Legend -->
  <rect x="530" y="65" width="230" height="120" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="545" y="85" fill="#94a3b8" font-size="11" font-weight="bold">Relaciones:</text>
  <text x="545" y="105" fill="#94a3b8" font-size="11">1:1 herencia de perfiles</text>
  <text x="545" y="125" fill="#94a3b8" font-size="11">1:N ofertas por empresa</text>
  <text x="545" y="145" fill="#94a3b8" font-size="11">1:N postulaciones</text>
  <text x="545" y="165" fill="#94a3b8" font-size="11">TypeORM cascade delete</text>
</svg>