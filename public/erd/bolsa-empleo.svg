<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">Bolsa de Empleo - Diagrama Entidad-Relación</text>
  
  <!-- ROW 1: Main Entities -->
  
  <!-- Entity: JobOffer -->
  <rect x="80" y="70" width="170" height="130" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="95" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">JobOffer</text>
  <line x1="80" y1="110" x2="250" y2="110" stroke="#475569"/>
  <text x="90" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="90" y="148" fill="#94a3b8" font-size="12">- title: String</text>
  <text x="90" y="166" fill="#94a3b8" font-size="12">- description: String</text>
  <text x="90" y="184" fill="#94a3b8" font-size="12">- location: String</text>
  
  <!-- Entity: Company -->
  <rect x="320" y="70" width="160" height="100" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">Company</text>
  <line x1="320" y1="110" x2="480" y2="110" stroke="#475569"/>
  <text x="330" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="330" y="148" fill="#94a3b8" font-size="12">- name: String</text>
  <text x="330" y="166" fill="#94a3b8" font-size="12">- sector: String</text>
  
  <!-- Entity: Category -->
  <rect x="550" y="70" width="160" height="80" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="95" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Category</text>
  <line x1="550" y1="110" x2="710" y2="110" stroke="#475569"/>
  <text x="560" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="560" y="148" fill="#94a3b8" font-size="12">- name: String</text>
  
  <!-- ROW 2: Child Entities -->
  
  <!-- Entity: Application -->
  <rect x="80" y="250" width="170" height="110" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="165" y="275" text-anchor="middle" fill="#ec4899" font-size="14" font-weight="bold">Application</text>
  <line x1="80" y1="290" x2="250" y2="290" stroke="#475569"/>
  <text x="90" y="310" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="90" y="328" fill="#94a3b8" font-size="12">- jobId: UUID (FK)</text>
  <text x="90" y="346" fill="#94a3b8" font-size="12">- applicantId: UUID (FK)</text>
  <text x="90" y="364" fill="#94a3b8" font-size="12">- status: Enum</text>
  
  <!-- Entity: User -->
  <rect x="320" y="250" width="160" height="100" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="275" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">User</text>
  <line x1="320" y1="290" x2="480" y2="290" stroke="#475569"/>
  <text x="330" y="310" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="330" y="328" fill="#94a3b8" font-size="12">- email: String</text>
  <text x="330" y="346" fill="#94a3b8" font-size="12">- name: String</text>
  
  <!-- Relationships -->
  <!-- JobOffer -> Company -->
  <line x1="250" y1="140" x2="320" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <text x="285" y="135" text-anchor="middle" fill="#94a3b8" font-size="10">N:1</text>
  
  <!-- JobOffer -> Category -->
  <line x1="250" y1="150" x2="250" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="180" x2="550" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="550" y1="180" x2="550" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" fill="#94a3b8" font-size="10">N:N</text>
  
  <!-- JobOffer -> Application -->
  <line x1="165" y1="200" x2="165" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <text x="155" y="230" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Company -> User -->
  <line x1="400" y1="170" x2="400" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="210" x2="480" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="210" x2="480" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="205" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Legend -->
  <rect x="50" y="400" width="700" height="40" rx="4" fill="#1e293b"/>
  <text x="60" y="420" fill="#94a3b8" font-size="11">Leyenda:</text>
  <rect x="110" y="412" width="10" height="10" fill="#3b82f6"/> <text x="128" y="420" fill="#94a3b8" font-size="11">Entidad</text>
  <circle cx="190" cy="417" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="205" y="420" fill="#94a3b8" font-size="11">PK</text>
  <circle cx="240" cy="417" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="255" y="420" fill="#94a3b8" font-size="11">FK</text>
  <text x="380" y="420" fill="#94a3b8" font-size="11">Cardinalidad: N (muchos), 1 (uno)</text>
</svg>