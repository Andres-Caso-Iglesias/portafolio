<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">FoodBites - Diagrama Entidad-Relacion</text>
  
  <!-- ROW 1: Central Entity -->
  
  <!-- Entity: FoodTruck (central) -->
  <rect x="300" y="65" width="200" height="100" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">FoodTruck</text>
  <line x1="300" y1="105" x2="500" y2="105" stroke="#475569"/>
  <text x="310" y="125" fill="#94a3b8" font-size="12">- id: Long (PK, auto)</text>
  <text x="310" y="143" fill="#94a3b8" font-size="12">- nombre, tipoCocina</text>
  <text x="310" y="161" fill="#94a3b8" font-size="12">- ubicacionActual: String</text>
  
  <!-- ROW 2: Side Entities -->
  
  <!-- Entity: Menu -->
  <rect x="40" y="230" width="170" height="100" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="125" y="255" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">Menu</text>
  <line x1="40" y1="270" x2="210" y2="270" stroke="#475569"/>
  <text x="50" y="290" fill="#94a3b8" font-size="11">- id: Long (PK)</text>
  <text x="50" y="308" fill="#94a3b8" font-size="11">- nombre, descripcion</text>
  <text x="50" y="326" fill="#94a3b8" font-size="11">- precio: Double</text>
  
  <!-- Entity: Usuario -->
  <rect x="290" y="230" width="180" height="100" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="380" y="255" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="bold">Usuario</text>
  <line x1="290" y1="270" x2="470" y2="270" stroke="#475569"/>
  <text x="300" y="290" fill="#94a3b8" font-size="11">- id: Long (PK)</text>
  <text x="300" y="308" fill="#94a3b8" font-size="11">- nombre, email (unique)</text>
  <text x="300" y="326" fill="#94a3b8" font-size="11">- password, ubicacion</text>
  
  <!-- Entity: Notificacion -->
  <rect x="550" y="230" width="200" height="100" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="255" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">Notificacion</text>
  <line x1="550" y1="270" x2="750" y2="270" stroke="#475569"/>
  <text x="560" y="290" fill="#94a3b8" font-size="11">- id: Long (PK)</text>
  <text x="560" y="308" fill="#94a3b8" font-size="11">- mensaje: String</text>
  <text x="560" y="326" fill="#94a3b8" font-size="11">- fechaEnvio: LocalDateTime</text>
  
  <!-- ROW 3: Pedido (bottom center) -->
  
  <!-- Entity: Pedido -->
  <rect x="290" y="390" width="220" height="85" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="bold">Pedido</text>
  <line x1="290" y1="430" x2="510" y2="430" stroke="#475569"/>
  <text x="300" y="450" fill="#94a3b8" font-size="11">- items, montoTotal</text>
  <text x="300" y="465" fill="#94a3b8" font-size="11">- estado, fechaCreacion</text>
  
  <!-- Relationships -->
  <!-- FoodTruck -> Menu -->
  <line x1="350" y1="165" x2="150" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="220" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Usuario -> Notificacion -->
  <line x1="470" y1="260" x2="550" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="510" y="255" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- FoodTruck -> Pedido -->
  <line x1="400" y1="165" x2="400" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <text x="410" y="240" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Usuario -> Pedido -->
  <line x1="380" y1="330" x2="400" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <text x="370" y="365" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Legend -->
  <rect x="40" y="420" width="220" height="50" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="55" y="440" fill="#94a3b8" font-size="11" font-weight="bold">6 entidades, 4 relaciones</text>
  <text x="55" y="458" fill="#94a3b8" font-size="11">CRUD + busqueda por ubicacion + top-orders</text>
</svg>