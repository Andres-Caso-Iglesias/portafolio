<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">FoodBites - Diagrama Entidad-Relación</text>
  
  <!-- ROW 1: Main Entities -->
  
  <!-- Entity: FoodTruck -->
  <rect x="80" y="70" width="160" height="110" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">FoodTruck</text>
  <line x1="80" y1="110" x2="240" y2="110" stroke="#475569"/>
  <text x="90" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="90" y="148" fill="#94a3b8" font-size="12">- name: String</text>
  <text x="90" y="166" fill="#94a3b8" font-size="12">- location: String</text>
  
  <!-- Entity: Product -->
  <rect x="320" y="70" width="160" height="110" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">Product</text>
  <line x1="320" y1="110" x2="480" y2="110" stroke="#475569"/>
  <text x="330" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="330" y="148" fill="#94a3b8" font-size="12">- foodTruckId: FK</text>
  <text x="330" y="166" fill="#94a3b8" font-size="12">- name: String</text>
  
  <!-- Entity: Client -->
  <rect x="560" y="70" width="160" height="90" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" fill="#ec4899" font-size="14" font-weight="bold">Client</text>
  <line x1="560" y1="110" x2="720" y2="110" stroke="#475569"/>
  <text x="570" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="570" y="148" fill="#94a3b8" font-size="12">- name: String</text>
  
  <!-- ROW 2: Child Entities -->
  
  <!-- Entity: Pedido -->
  <rect x="80" y="240" width="170" height="120" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="165" y="265" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Pedido</text>
  <line x1="80" y1="280" x2="250" y2="280" stroke="#475569"/>
  <text x="90" y="300" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="90" y="318" fill="#94a3b8" font-size="12">- productId: FK</text>
  <text x="90" y="336" fill="#94a3b8" font-size="12">- clientId: FK</text>
  <text x="90" y="354" fill="#94a3b8" font-size="12">- status: Enum</text>
  
  <!-- Entity: Inventory -->
  <rect x="320" y="240" width="160" height="90" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">Inventory</text>
  <line x1="320" y1="280" x2="480" y2="280" stroke="#475569"/>
  <text x="330" y="300" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="330" y="318" fill="#94a3b8" font-size="12">- productId: FK</text>
  <text x="330" y="336" fill="#94a3b8" font-size="12">- quantity: Integer</text>
  
  <!-- Relationships -->
  <!-- FoodTruck -> Product -->
  <line x1="240" y1="120" x2="320" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <text x="280" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- FoodTruck -> Pedido -->
  <line x1="160" y1="180" x2="160" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="210" x2="80" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="210" x2="80" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="205" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Product -> Inventory -->
  <line x1="400" y1="180" x2="400" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <text x="410" y="215" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Product -> Pedido -->
  <line x1="320" y1="180" x2="320" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="200" x2="250" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="250" y1="200" x2="250" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <text x="285" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Client -> Pedido -->
  <line x1="640" y1="160" x2="640" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="640" y1="200" x2="250" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Legend -->
  <rect x="50" y="400" width="700" height="40" rx="4" fill="#1e293b"/>
  <text x="60" y="420" fill="#94a3b8" font-size="11">Leyenda:</text>
  <rect x="110" y="412" width="10" height="10" fill="#3b82f6"/> <text x="128" y="420" fill="#94a3b8" font-size="11">Entidad</text>
  <circle cx="190" cy="417" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="205" y="420" fill="#94a3b8" font-size="11">PK</text>
  <circle cx="240" cy="417" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="255" y="420" fill="#94a3b8" font-size="11">FK</text>
  <text x="380" y="420" fill="#94a3b8" font-size="11">Cardinalidad: N (muchos), 1 (uno)</text>
</svg>