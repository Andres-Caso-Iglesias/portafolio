<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">Gestor de Huertos Urbanos - Diagrama Entidad-Relación</text>
  
  <!-- ROW 1: Main Entities -->
  
  <!-- Entity: Usuario -->
  <rect x="80" y="70" width="160" height="120" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" fill="#8b5cf6" font-size="14" font-weight="bold">Usuario</text>
  <line x1="80" y1="110" x2="240" y2="110" stroke="#475569"/>
  <text x="90" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="90" y="148" fill="#94a3b8" font-size="12">- nombre: String</text>
  <text x="90" y="166" fill="#94a3b8" font-size="12">- email: String</text>
  
  <!-- Entity: Huerto -->
  <rect x="320" y="70" width="160" height="130" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">Huerto</text>
  <line x1="320" y1="110" x2="480" y2="110" stroke="#475569"/>
  <text x="330" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="330" y="148" fill="#94a3b8" font-size="12">- id_usuario: FK</text>
  <text x="330" y="166" fill="#94a3b8" font-size="12">- nombre: String</text>
  <text x="330" y="184" fill="#94a3b8" font-size="12">- ubicacion: String</text>
  
  <!-- Entity: Cultivo -->
  <rect x="560" y="70" width="160" height="130" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">Cultivo</text>
  <line x1="560" y1="110" x2="720" y2="110" stroke="#475569"/>
  <text x="570" y="130" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="570" y="148" fill="#94a3b8" font-size="12">- id_huerto: FK</text>
  <text x="570" y="166" fill="#94a3b8" font-size="12">- nombre: String</text>
  <text x="570" y="184" fill="#94a3b8" font-size="12">- tipo: String</text>
  
  <!-- ROW 2: Child Entities (aligned under parents) -->
  
  <!-- Entity: Tarea (under Huerto center: 400) -->
  <rect x="320" y="260" width="160" height="100" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Tarea</text>
  <line x1="320" y1="300" x2="480" y2="300" stroke="#475569"/>
  <text x="330" y="320" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="330" y="338" fill="#94a3b8" font-size="12">- id_cultivo: FK</text>
  <text x="330" y="356" fill="#94a3b8" font-size="12">- titulo: String</text>
  
  <!-- Entity: Cosecha (under Cultivo center: 640) -->
  <rect x="560" y="260" width="160" height="100" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="640" y="285" text-anchor="middle" fill="#ec4899" font-size="14" font-weight="bold">Cosecha</text>
  <line x1="560" y1="300" x2="720" y2="300" stroke="#475569"/>
  <text x="570" y="320" fill="#94a3b8" font-size="12">- id: UUID (PK)</text>
  <text x="570" y="338" fill="#94a3b8" font-size="12">- id_cultivo: FK</text>
  <text x="570" y="356" fill="#94a3b8" font-size="12">- cantidad_kg: Number</text>
  
  <!-- Relationships (vertical lines) -->
  <!-- Usuario -> Huerto -->
  <line x1="160" y1="190" x2="160" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="210" x2="320" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="210" x2="320" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="280" y="205" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Huerto -> Cultivo -->
  <line x1="480" y1="130" x2="560" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="520" y="125" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Cultivo -> Tarea -->
  <line x1="640" y1="200" x2="640" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="650" y="235" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Cultivo -> Cosecha -->
  <line x1="640" y1="200" x2="640" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="650" y="235" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  <line x1="560" y1="260" x2="640" y2="260" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Legend -->
  <rect x="50" y="420" width="700" height="40" rx="4" fill="#1e293b"/>
  <text x="60" y="440" fill="#94a3b8" font-size="11">Leyenda:</text>
  <rect x="110" y="432" width="10" height="10" fill="#3b82f6"/> <text x="128" y="440" fill="#94a3b8" font-size="11">Entidad</text>
  <circle cx="190" cy="437" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="205" y="440" fill="#94a3b8" font-size="11">PK</text>
  <circle cx="240" cy="437" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/> <text x="255" y="440" fill="#94a3b8" font-size="11">FK</text>
  <text x="380" y="440" fill="#94a3b8" font-size="11">Cardinalidad: N (muchos), 1 (uno)</text>
</svg>