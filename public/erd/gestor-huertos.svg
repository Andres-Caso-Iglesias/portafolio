<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Gestor de Huertos - Diagrama Entidad-Relacion</text>
  
  <!-- ROW 1: Main Entity -->
  
  <!-- Entity: Huerto -->
  <rect x="300" y="65" width="200" height="100" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">Huerto</text>
  <line x1="300" y1="105" x2="500" y2="105" stroke="#475569"/>
  <text x="310" y="125" fill="#94a3b8" font-size="12">- id: Long (PK, auto)</text>
  <text x="310" y="143" fill="#94a3b8" font-size="12">- nombre: String</text>
  <text x="310" y="161" fill="#94a3b8" font-size="12">- ubicacion: String</text>
  
  <!-- ROW 2: Children -->
  
  <!-- Entity: Bancal -->
  <rect x="40" y="230" width="170" height="120" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="125" y="255" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">Bancal</text>
  <line x1="40" y1="270" x2="210" y2="270" stroke="#475569"/>
  <text x="50" y="290" fill="#94a3b8" font-size="11">- id: Long (PK)</text>
  <text x="50" y="308" fill="#94a3b8" font-size="11">- nombre, dimensiones</text>
  <text x="50" y="326" fill="#94a3b8" font-size="11">- huerto_id: FK</text>
  <text x="50" y="344" fill="#94a3b8" font-size="11">- semilla_id: FK (1:1)</text>
  
  <!-- Entity: Semilla -->
  <rect x="300" y="230" width="200" height="120" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="255" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">Semilla</text>
  <line x1="300" y1="270" x2="500" y2="270" stroke="#475569"/>
  <text x="310" y="290" fill="#94a3b8" font-size="11">- id: Long (PK)</text>
  <text x="310" y="308" fill="#94a3b8" font-size="11">- nombre, variedad</text>
  <text x="310" y="326" fill="#94a3b8" font-size="11">- cantidad: Integer</text>
  <text x="310" y="344" fill="#94a3b8" font-size="11">- proveedor, notas</text>
  
  <!-- Entity: RegistroCultivo -->
  <rect x="570" y="230" width="190" height="100" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="665" y="255" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="bold">RegistroCultivo</text>
  <line x1="570" y1="270" x2="760" y2="270" stroke="#475569"/>
  <text x="580" y="290" fill="#94a3b8" font-size="11">- id: Long (PK)</text>
  <text x="580" y="308" fill="#94a3b8" font-size="11">- bancal_id (1:1), semilla_id (1:1)</text>
  <text x="580" y="326" fill="#94a3b8" font-size="11">- fecha: LocalDate</text>
  
  <!-- ROW 3: Siembra -->
  
  <!-- Entity: Siembra -->
  <rect x="300" y="410" width="200" height="70" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="400" y="435" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="bold">Siembra</text>
  <line x1="300" y1="450" x2="500" y2="450" stroke="#475569"/>
  <text x="310" y="468" fill="#94a3b8" font-size="11">- cantidadSembrada, notas</text>
  
  <!-- Relationships -->
  <!-- Huerto -> Bancal -->
  <line x1="360" y1="165" x2="150" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="220" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Bancal -> RegistroCultivo -->
  <line x1="210" y1="290" x2="570" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="285" text-anchor="middle" fill="#94a3b8" font-size="10">1:1</text>
  
  <!-- Bancal -> Semilla -->
  <line x1="210" y1="300" x2="300" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">1:1</text>
  
  <!-- RegistroCultivo -> Siembra -->
  <line x1="665" y1="330" x2="500" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <text x="590" y="395" text-anchor="middle" fill="#94a3b8" font-size="10">1:N</text>
  
  <!-- Legend -->
  <rect x="40" y="480" width="720" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="55" y="500" fill="#94a3b8" font-size="11">Frontend: HTML + Bootstrap 5 + JS vanilla | Unico controller REST (HuertoController) | ddl-auto=update</text>
</svg>