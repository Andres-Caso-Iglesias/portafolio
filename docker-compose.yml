version: '3.8'
services:
  mysql-foodbites:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodbites
    ports:
      - "3306:3306"
  
  postgres-bolsa:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolsa_empleo
    ports:
      - "5432:5432"
  
  mysql-huertos:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: huertos_urbanos
    ports:
      - "3307:3306"
